# Fast exploratory pilot for laptop validation; not the p=113 research baseline.
experiment:
  name: laptop_pilot_modular_addition_p11
  seed: 42
  output_root: results/laptop_pilot/phase1
  checkpoint_root: checkpoints/laptop_pilot/phase1

data:
  prime: 11
  operation: addition
  train_fraction: 0.30
  data_seed: 42
  control: none

model:
  d_model: 16
  n_heads: 2
  n_layers: 1
  d_mlp: 32
  dropout: 0.0

training:
  max_steps: 3000
  batch_size: full
  microbatch_size: 256
  eval_batch_size: 256
  learning_rate: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  log_every: 100
  eval_every: 10
  checkpoint_every: 250
  milestones: [100, 250, 500, 1000, 2000]
  cpu_threads: 2

memorization:
  train_accuracy_threshold: 0.99

grokking:
  train_accuracy_threshold: 0.99
  test_accuracy_threshold: 0.95
  required_consecutive_evals: 3
  post_grok_steps: 500

multi_seed:
  enabled: true
  model_seeds: [0, 1, 2]

phase3:
  checkpoint_root: checkpoints/laptop_pilot/phase2
  source_results_root: results/laptop_pilot/phase2
  output_root: results/laptop_pilot/phase3
  seeds: [0, 1, 2]
  checkpoints: [initial, final]
  batch_size: 128
  representation_examples: 121
  ablation_examples: 85
  patching_examples: 64
  top_k: [1, 3, 5]
  minimum_head_match_similarity: 0.25

phase4:
  model_seeds: [0, 1, 2]
  max_runs_without_confirmation: 10
  analysis_tier: 1
