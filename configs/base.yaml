experiment:
  name: modular_addition_baseline
  seed: 42
  output_root: results
  checkpoint_root: checkpoints

data:
  prime: 113
  operation: addition
  train_fraction: 0.30
  data_seed: 42
  control: none

model:
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_mlp: 512
  dropout: 0.0

training:
  max_steps: 100000
  batch_size: full
  microbatch_size: 256
  eval_batch_size: 512
  learning_rate: 0.001
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.98
  log_every: 100
  eval_every: 100
  checkpoint_every: 1000
  milestones: [100, 500, 1000, 2000, 5000, 10000, 20000, 50000]
  cpu_threads: 4

memorization:
  train_accuracy_threshold: 0.99

grokking:
  train_accuracy_threshold: 0.99
  test_accuracy_threshold: 0.95
  required_consecutive_evals: 3
  post_grok_steps: 2000

